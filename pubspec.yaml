name: chatmate
description: ChatMate - Aplikasi chat mirip WhatsApp dengan Flutter & Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.3

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Media & files
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  open_filex: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  mime: ^1.0.5
  dio: ^5.4.3+1

  # State management
  provider: ^6.1.2

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
